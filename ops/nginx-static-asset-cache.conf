# OPTIONAL Nginx server{} snippet. Manual VPS administrator review required.
# Do not place in repository deploy path or execute automatically.
# Only local static files: PHP/HTML routes are not cached by these rules.
# CSS/JS already use ?v=filemtime cache-busting in app/views/layout.php.
location ~* ^/assets/.*\.(?:css|js)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
}
location ~* ^/uploads/.*\.(?:webp|png|jpe?g|gif|svg)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}
