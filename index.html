<style>
:root{--p:#4338ca;--p2:#312e81;--bg:#f4f6ff;--card:#fff;--tx:#1e1b4b;--mu:#64748b;--bd:#e2e8f0;--warn:#fff7ed;--warnbd:#fdba74;--warntx:#9a3412}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
.disc-bar{background:var(--warn);border-bottom:1px solid var(--warnbd);color:var(--warntx);font-size:.85rem;padding:.55rem 1rem;text-align:center}
.disc-bar button{background:none;border:none;color:var(--p);font-weight:600;cursor:pointer;text-decoration:underline;font-size:.85rem}
header.top{background:#fff;border-bottom:1px solid var(--bd);padding:.9rem 1.2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem}
.brand{display:flex;align-items:center;gap:.8rem}
.brand .logo-img{height:44px;width:auto;display:block}
.brand p{margin:0;color:var(--mu);font-size:.9rem}
.lang{display:flex;background:#eef2ff;border-radius:999px;padding:3px}
.lang button{border:none;background:none;padding:.4rem .9rem;border-radius:999px;cursor:pointer;font-size:.9rem;color:var(--mu)}
.lang button.on{background:var(--p);color:#fff}
.hero{background:linear-gradient(#eef2ff,#f4f6ff);padding:2.2rem 1rem 2.4rem;text-align:center}
.hero h2{margin:0 0 .4rem;font-size:1.7rem}
.hero p{margin:0 0 1.4rem;color:var(--mu)}
.search{max-width:680px;margin:0 auto;display:flex;background:#fff;border-radius:999px;box-shadow:0 6px 20px rgba(67,56,202,.12);overflow:hidden;border:1px solid var(--bd)}
.search input{flex:1;border:none;outline:none;padding:.9rem 1.2rem;font-size:1rem;min-width:0;background:transparent}
.search button{background:var(--p);color:#fff;border:none;padding:0 1.5rem;font-size:1rem;cursor:pointer}
.search-hint{font-size:.8rem;color:var(--mu);margin-top:.5rem}
.cats{display:flex;gap:.6rem;overflow-x:auto;padding:1.2rem 1rem;max-width:1100px;margin:0 auto}
.cat{flex:0 0 auto;display:flex;align-items:center;gap:.4rem;border:1px solid var(--bd);background:#fff;border-radius:999px;padding:.45rem .9rem;cursor:pointer;font-size:.92rem;color:var(--tx)}
.cat.on{background:var(--p);border-color:var(--p);color:#fff}
main{max-width:1100px;margin:0 auto;padding:0 1rem 2rem}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:.5rem 0 1rem}
.sec h3{margin:0;font-size:1.25rem}
.sec span{color:var(--mu);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:1.2rem;display:flex;flex-direction:column}
.ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:.6rem}
.card h4{margin:0 0 .4rem;font-size:1.02rem;line-height:1.35}
.tag{align-self:flex-start;font-size:.75rem;padding:.18rem .6rem;border-radius:999px;background:#eef2ff;color:var(--p);margin-bottom:.6rem}
.card p{margin:0 0 .7rem;color:#334155;font-size:.92rem;flex:1}
.meta{font-size:.82rem;color:var(--mu);margin:.2rem 0 .8rem}
.btn{display:block;text-align:center;background:var(--p);color:#fff;text-decoration:none;padding:.6rem;border-radius:9px;font-size:.92rem}
.btn:hover{background:var(--p2)}
.btn.off{background:#cbd5e1;color:#475569;pointer-events:none}
.empty{display:none;background:#fff;border:1px dashed #c7d2fe;border-radius:14px;padding:2rem 1rem;text-align:center;margin-top:1rem}
.empty h4{margin:.4rem 0}
.empty p{color:var(--mu);margin:.2rem 0 1rem}
.empty button{background:var(--p);color:#fff;border:none;padding:.6rem 1.2rem;border-radius:9px;cursor:pointer}
footer{background:var(--p);color:#fff;padding:1.4rem 1rem}
footer .in{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}
footer small{opacity:.85;display:block;max-width:560px;font-size:.84rem}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:1rem;z-index:10}
.modal.open{display:flex}
.modal .box{background:#fff;color:var(--tx);max-width:560px;width:100%;border-radius:16px;padding:1.5rem;max-height:86vh;overflow:auto}
.modal h3{margin:0 0 .8rem}
.modal p,.modal li{font-size:.94rem}
.modal button{background:var(--p);color:#fff;border:none;padding:.6rem 1.2rem;border-radius:9px;cursor:pointer;margin-top:.6rem}
</style>

    keys:"school shiksha padhai bachche education शिक्षा स्कूल बच्चे" },
  { cat:"rozgar", icon:"👥", page:null,
    name:{hi:"प्रधानमंत्री कौशल विकास योजना (PMKVY)",en:"Pradhan Mantri Kaushal Vikas Yojana (PMKVY)"},
    desc:{hi:"युवाओं को मुफ्त कौशल प्रशिक्षण और प्रमाण पत्र।",en:"Free skill training and certification for youth."},
    elig:{hi:"भारत के युवा, कौशल प्रशिक्षण के इच्छुक",en:"Indian youth wanting skill training"},
    keys:"rozgar job skill kaushal naukri नौकरी रोज़गार कौशल प्रशिक्षण" },
  { cat:"pension", icon:"👴", page:null,
    name:{hi:"अटल पेंशन योजना",en:"Atal Pension Yojana"},
    desc:{hi:"असंगठित क्षेत्र के लिए बुढ़ापे में निश्चित पेंशन।",en:"Guaranteed pension in old age for unorganised sector workers."},
    elig:{hi:"18–40 वर्ष, बचत बैंक खाता",en:"Age 18–40 years, with a savings bank account"},
    keys:"pension budhape retirement पेंशन बुढ़ापा" }
];

let lang = "hi";
let cat = "all";
let query = "";

const $ = id => document.getElementById(id);
function hasDevanagari(s){ return /[\u0900-\u097F]/.test(s); }
function hasLatin(s){ return /[A-Za-z]/.test(s); }

function applyStaticText(){
  const t = UI[lang];
  document.documentElement.lang = lang;
  $("discBarText").textContent = t.discBar;
  $("openDisc").textContent = t.discBtn;
  $("heroTitle").textContent = t.heroTitle;
  $("heroSub").textContent = t.heroSub;
  $("q").placeholder = t.searchPh;
  $("searchBtn").textContent = t.searchBtn;
  $("hint").textContent = t.hint;
  $("listTitle").textContent = t.listTitle;
  $("emptyTitle").textContent = t.emptyTitle;
  $("emptyText").textContent = t.emptyText;
  $("showAll").textContent = t.showAll;
  $("footTag").textContent = t.footTag;
  $("footDisc").textContent = t.footDisc;
  $("mdTitle").textContent = t.mdTitle;
  $("mdBody").innerHTML = t.mdBody;
  $("mdClose").textContent = t.mdClose;
  $("lHi").classList.toggle("on", lang === "hi");
  $("lEn").classList.toggle("on", lang === "en");
}

function renderCats(){
  const wrap = $("cats");
  wrap.innerHTML = "";
  const items = [{key:"all", label: lang==="hi" ? "सभी" : "All", icon:"✨", bg:"#eef2ff"}]
    .concat(Object.entries(CATS).map(([k,c]) => ({key:k, label:c[lang], icon:c.icon, bg:c.bg})));
  items.forEach(it => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cat" + (cat === it.key ? " on" : "");
    if (cat !== it.key) b.style.background = it.bg;
    const s1 = document.createElement("span"); s1.textContent = it.icon;
    const s2 = document.createElement("span"); s2.textContent = it.label;
    b.append(s1, s2);
    b.onclick = () => { cat = it.key; renderCats(); renderCards(); };
    wrap.appendChild(b);
  });
}

function renderCards(){
  const q = query.trim().toLowerCase();
  const list = SCHEMES.filter(s =>
    (cat === "all" || s.cat === cat) &&
    (!q || s.name.hi.toLowerCase().includes(q) || s.name.en.toLowerCase().includes(q) ||
     s.desc.hi.toLowerCase().includes(q) || s.desc.en.toLowerCase().includes(q) ||
     s.keys.toLowerCase().includes(q) || CATS[s.cat].en.toLowerCase().includes(q))
  );
  const t = UI[lang];
  const grid = $("grid");
  grid.innerHTML = "";
  list.forEach(s => {
    const c = CATS[s.cat];
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div class="ic" style="background:${c.bg}">${s.icon}</div>
      <h4></h4>
      <span class="tag"></span>
      <p></p>
      <div class="meta"><b>${t.elig}:</b> <span class="e"></span></div>
      <a class="btn" href="#"></a>`;
    card.querySelector("h4").textContent = s.name[lang];
    card.querySelector(".tag").textContent = c[lang];
    card.querySelector("p").textContent = s.desc[lang];
    card.querySelector(".e").textContent = s.elig[lang];
    const a = card.querySelector(".btn");
    if (s.page) {
      a.href = s.page;
      a.textContent = t.more;
    } else {
      a.classList.add("off");
      a.setAttribute("aria-disabled", "true");
      a.textContent = t.soon;
    }
    grid.appendChild(card);
  });
  $("count").textContent = t.count(list.length);
  $("empty").style.display = list.length ? "none" : "block";
}

function setLang(l){ lang = l; applyStaticText(); renderCats(); renderCards(); }

$("lHi").onclick = () => setLang("hi");
$("lEn").onclick = () => setLang("en");

$("q").addEventListener("input", e => {
  const v = e.target.value;
  query = v;
  if (hasDevanagari(v)) { if (lang !== "hi") setLang("hi"); else renderCards(); }
  else if (hasLatin(v)) { if (lang !== "en") setLang("en"); else renderCards(); }
  else renderCards();
});

$("searchForm").addEventListener("submit", e => { e.preventDefault(); renderCards(); });

$("showAll").onclick = () => { query = ""; $("q").value = ""; cat = "all"; renderCats(); renderCards(); };

const modal = $("modal");
$("openDisc").onclick = () => modal.classList.add("open");
$("mdClose").onclick = () => modal.classList.remove("open");
modal.addEventListener("click", e => { if (e.target === modal) modal.classList.remove("open"); });

applyStaticText();
renderCats();
renderCards();
</script>
</body>
</html>
