name: Mobile LCP Paint Timeline (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Capture mobile LCP and paint snapshots
        run: node scripts/mobile-lcp-timeline.cjs
      - name: Upload diagnostic screenshots and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-lcp-timeline
          path: mobile-lcp-timeline/
          if-no-files-found: warn
