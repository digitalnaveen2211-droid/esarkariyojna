name: Live SEO Audit (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public SEO URLs
        run: python3 scripts/live_seo_audit.py
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-seo-audit-report
          path: seo-audit-report.json
          if-no-files-found: warn
