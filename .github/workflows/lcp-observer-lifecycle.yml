name: LCP Observer Lifecycle Check (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture native LCP observer and visibility state
        run: node scripts/check_lcp_observer_lifecycle.cjs
      - name: Upload read-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcp-lifecycle
          path: lcp-lifecycle/
          if-no-files-found: warn
