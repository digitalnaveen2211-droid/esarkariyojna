name: Post-Deploy 42 Blog Link Audit (Read Only)
on:
  pull_request:
    paths:
      - 'scripts/audit-postdeploy-blog-links.py'
      - '.github/workflows/postdeploy-blog-links.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate syntax
        run: python -m py_compile scripts/audit-postdeploy-blog-links.py
      - name: Crawl 42 live Hindi and English blogs
        run: python scripts/audit-postdeploy-blog-links.py
      - name: Upload detailed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postdeploy-42-blog-links
          path: blog-link-postdeploy/
          retention-days: 30
