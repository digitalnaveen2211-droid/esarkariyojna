name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validate PHP before uploading any files to production.
      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -r -n1 php -l

      # Build a smaller production stylesheet. Level 1 optimizes individual
      # declarations but does not merge/reorder selector blocks or remove
      # unverified selectors needed by CMS, other routes or responsive states.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Optimize CSS for production
        run: |
          set -euo pipefail
          npx --yes clean-css-cli@5 -O1 -o assets/style.min.css assets/style.css
          test -s assets/style.min.css
          echo "Source CSS bytes: $(wc -c < assets/style.css)"
          echo "Built CSS bytes:  $(wc -c < assets/style.min.css)"
          test "$(wc -c < assets/style.min.css)" -le "$(wc -c < assets/style.css)"

      # Optional pixel-identical logo asset; fall back to original PNG if no
      # smaller, verified lossless WebP can be produced.
      - name: Generate lossless logo candidate
        run: |
          set -euo pipefail
          python3 -m pip install --user Pillow==11.3.0
          python3 scripts/build-lossless-logo.py

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload site files
        run: |
          rsync -avz \
            --exclude '.git' --exclude '.github' --exclude 'README.md' --exclude '.cache' --exclude '.well-known' \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/"

      # Pre-generate small WebP card previews outside visitors' PHP requests.
      # Cache-only operation: source uploads and database records are untouched.
      - name: Warm optimized card images
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.VPS_PATH }}' && php scripts/warm-image-thumbnails.php"

      # The site is now served by index.php (CMS). Remove the old static files, otherwise
      # nginx would keep serving them instead of the CMS pages.
      - name: Remove old static files
        run: |
          ssh -p ${{ secrets.VPS_PORT || 22 }} "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.VPS_PATH }}' && rm -f index.html sitemap.xml robots.txt yojna/pm-kisan.html && rmdir yojna 2>/dev/null; mkdir -p uploads; true"

      # Database migrations and CMS draft imports are deliberately NOT part of every push.
      # They are guarded, content-changing operations that require separate review and
      # explicit execution after checking the current live database.
      # Manual scripts (do not run automatically):
      #   php scripts/add-approved-categories.php
      #   php scripts/import-19-researched-drafts.php --check
      #   php scripts/import-19-researched-drafts.php --import
