name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload site files
        run: |
          rsync -avz \
            --exclude '.git' --exclude '.github' --exclude 'README.md' --exclude '.cache' --exclude '.well-known' \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/"

      # The site is now served by index.php (CMS). Remove the old static files, otherwise
      # nginx would keep serving them instead of the CMS pages.
      - name: Remove old static files
        run: |
          ssh -p ${{ secrets.VPS_PORT || 22 }} "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.VPS_PATH }}' && rm -f index.html sitemap.xml robots.txt yojna/pm-kisan.html && rmdir yojna 2>/dev/null; mkdir -p uploads; true"
