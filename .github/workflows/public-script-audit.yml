name: Public Script and Ad Placement Audit (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public HTML for duplicate tags and early ad slots
        run: python scripts/audit_public_scripts.py
      - name: Upload sanitized inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-script-audit
          path: public-script-audit/
          if-no-files-found: warn
